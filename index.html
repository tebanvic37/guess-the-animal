<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Naming Challenge!</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f39c12;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --bg-color: #f0f4f8;
            --card-bg: #2c3e50;
            --text-light: #ffffff;
            --text-dark: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--card-bg);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        /* Scoreboard */
        .scoreboard {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 900px;
            justify-content: center;
        }

        .team-card {
            background: white;
            border-radius: 12px;
            padding: 15px 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            flex: 1;
            max-width: 250px;
            border: 3px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }

        .team-card.active {
            border-color: var(--secondary-color);
            transform: scale(1.05);
        }

        .team-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-dark);
        }

        .team-score {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        /* Game Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 20px;
        }

        .grid-card {
            background-color: var(--card-bg);
            color: var(--text-light);
            border-radius: 10px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: transform 0.2s, background-color 0.2s;
            user-select: none;
        }

        .grid-card:hover {
            transform: translateY(-5px);
            background-color: #34495e;
        }

        .grid-card.opened {
            background-color: #bdc3c7;
            color: #7f8c8d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
        }

        .difficulty-tag {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: bold;
            color: white;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .diff-easy { background-color: var(--success-color); }
        .diff-moderate { background-color: var(--secondary-color); }
        .diff-hard { background-color: var(--danger-color); }
        .diff-event { background-color: #9b59b6; }

        .question-box {
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .animal-illustration {
            width: 180px;
            height: 180px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 100px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .event-text {
            font-size: 1.5rem;
            color: var(--text-dark);
            font-weight: bold;
        }

        .answer-text {
            font-size: 1.4rem;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 20px;
            display: none;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-check { background-color: var(--primary-color); color: white; }
        .btn-correct { background-color: var(--success-color); color: white; }
        .btn-wrong { background-color: var(--danger-color); color: white; }
        .btn-close { background-color: #7f8c8d; color: white; }

        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
            }
            .scoreboard {
                flex-direction: column;
                align-items: center;
            }
            .team-card {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Animal Naming Challenge!</h1>
        <p>Pick a number, name the animal in the image, or face a surprise!</p>
    </header>

    <div class="scoreboard">
        <div class="team-card active" id="team1-card">
            <div class="team-name">Team 1</div>
            <div class="team-score" id="team1-score">0</div>
        </div>
        <div class="team-card" id="team2-card">
            <div class="team-name">Team 2</div>
            <div class="team-score" id="team2-score">0</div>
        </div>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="difficulty-tag" id="modal-tag">Easy</span>
            <div class="question-box" id="modal-question"></div>
            <div class="answer-text" id="modal-answer">Answer goes here</div>
            <div class="modal-actions" id="modal-actions">
                <button class="btn btn-check" id="btn-show-answer" onclick="showAnswer()">Check Answer</button>
                <button class="btn btn-correct" id="btn-correct" style="display: none;" onclick="handleResult(true)">Correct</button>
                <button class="btn btn-wrong" id="btn-wrong" style="display: none;" onclick="handleResult(false)">Wrong</button>
                <button class="btn btn-close" id="btn-continue" style="display: none;" onclick="closeModal()">Continue</button>
            </div>
        </div>
    </div>

    <script>
        // Custom Platypus SVG Illustration
        const platypusSVG = `<svg width="140" height="140" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="18" cy="53" rx="16" ry="7" fill="#4a3121" transform="rotate(-15 18 53)"/>
            <path d="M 12 48 Q 18 45 24 49 Q 18 57 12 53 Z" fill="#321e12"/>
            <ellipse cx="50" cy="55" rx="26" ry="18" fill="#734929"/>
            <circle cx="70" cy="46" r="13" fill="#734929"/>
            <circle cx="73" cy="42" r="2.5" fill="#000000"/>
            <circle cx="74" cy="41" r="0.8" fill="#ffffff"/>
            <path d="M 78 44 C 88 43, 98 45, 96 52 C 88 55, 78 52, 76 48 Z" fill="#2b2b2b"/>
            <ellipse cx="42" cy="71" rx="6" ry="3" fill="#2b2b2b"/>
            <ellipse cx="62" cy="71" rx="6" ry="3" fill="#2b2b2b"/>
        </svg>`;

        const gameData = [
            { id: 1, type: 'q', diff: 'easy', pts: 10, icon: '🐶', bg: '#f7d794', a: "Dog" },
            { id: 2, type: 'q', diff: 'easy', pts: 10, icon: '🐧', bg: '#778ca3', a: "Penguin" },
            { id: 3, type: 'event', diff: 'event', title: "LOSE POINTS!", msg: "Uh oh! You tripped over a turtle. Lose 15 points!", pts: -15 },
            { id: 4, type: 'q', diff: 'moderate', pts: 20, icon: '🐘', bg: '#d1d8e0', a: "Elephant" },
            { id: 5, type: 'q', diff: 'hard', pts: 30, icon: '🦥', bg: '#c7ace1', a: "Sloth" },
            { id: 6, type: 'event', diff: 'event', title: "BONUS POINTS!", msg: "You found a lucky horseshoe! Gain 25 points!", pts: 25 },
            { id: 7, type: 'q', diff: 'easy', pts: 10, icon: '🦘', bg: '#f5cd79', a: "Kangaroo" },
            { id: 8, type: 'q', diff: 'moderate', pts: 20, icon: '🐅', bg: '#e15f41', a: "Tiger" },
            { id: 9, type: 'q', diff: 'hard', pts: 30, customSvg: platypusSVG, bg: '#546de5', a: "Platypus" },
            { id: 10, type: 'event', diff: 'event', title: "STEAL POINTS!", msg: "A monkey stole 20 points from the other team and gave them to you!", steal: 20 },
            { id: 11, type: 'q', diff: 'moderate', pts: 20, icon: '🐬', bg: '#3dc1d3', a: "Dolphin" },
            { id: 12, type: 'q', diff: 'easy', pts: 10, icon: '🦩', bg: '#f78fb3', a: "Flamingo" },
            { id: 13, type: 'q', diff: 'hard', pts: 30, icon: '🦎', bg: '#78e08f', a: "Gecko" },
            { id: 14, type: 'event', diff: 'event', title: "BANKRUPT!", msg: "A crocodile ate all your current points! Reset to 0.", zero: true },
            { id: 15, type: 'q', diff: 'moderate', pts: 20, icon: '🦒', bg: '#f8c291', a: "Giraffe" },
            { id: 16, type: 'q', diff: 'hard', pts: 30, icon: '🐙', bg: '#60a3bc', a: "Octopus" }
        ];

        let scores = { 1: 0, 2: 0 };
        let activeTeam = 1;
        let activeCardData = null;

        const gridContainer = document.getElementById('grid');
        
        function initGrid() {
            gridContainer.innerHTML = '';
            gameData.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('grid-card');
                card.innerText = item.id;
                card.id = `card-${item.id}`;
                card.onclick = () => openCard(item);
                gridContainer.appendChild(card);
            });
        }

        function openCard(item) {
            const cardElem = document.getElementById(`card-${item.id}`);
            if (cardElem.classList.contains('opened')) return;

            activeCardData = item;
            cardElem.classList.add('opened');

            const modal = document.getElementById('modal');
            const tag = document.getElementById('modal-tag');
            const questionBox = document.getElementById('modal-question');
            const answerText = document.getElementById('modal-answer');

            document.getElementById('btn-show-answer').style.display = 'inline-block';
            document.getElementById('btn-correct').style.display = 'none';
            document.getElementById('btn-wrong').style.display = 'none';
            document.getElementById('btn-continue').style.display = 'none';
            answerText.style.display = 'none';

            if (item.type === 'q') {
                tag.innerText = `${item.diff} • ${item.pts} Points`;
                tag.className = `difficulty-tag diff-${item.diff}`;
                
                const content = item.customSvg ? item.customSvg : item.icon;
                questionBox.innerHTML = `<div class="animal-illustration" style="background-color: ${item.bg}">${content}</div>`;
                answerText.innerText = `Answer: ${item.a}`;
            } else {
                tag.innerText = "SURPRISE!";
                tag.className = 'difficulty-tag diff-event';
                questionBox.innerHTML = `<div class="event-text">${item.msg}</div>`;
                
                document.getElementById('btn-show-answer').style.display = 'none';
                document.getElementById('btn-continue').style.display = 'inline-block';

                applyEventEffect(item);
            }

            modal.classList.add('active');
        }

        function showAnswer() {
            document.getElementById('modal-answer').style.display = 'block';
            document.getElementById('btn-show-answer').style.display = 'none';
            document.getElementById('btn-correct').style.display = 'inline-block';
            document.getElementById('btn-wrong').style.display = 'inline-block';
        }

        function handleResult(isCorrect) {
            if (isCorrect && activeCardData.pts) {
                scores[activeTeam] += activeCardData.pts;
            }
            updateScores();
            switchTurn();
            closeModal();
        }

        function applyEventEffect(item) {
            const otherTeam = activeTeam === 1 ? 2 : 1;
            
            if (item.pts) {
                scores[activeTeam] += item.pts;
            } else if (item.steal) {
                const stolen = Math.min(scores[otherTeam], item.steal);
                scores[otherTeam] -= stolen;
                scores[activeTeam] += stolen;
            } else if (item.zero) {
                scores[activeTeam] = 0;
            }
            updateScores();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            if (activeCardData && activeCardData.type === 'event') {
                switchTurn();
            }
            activeCardData = null;
        }

        function switchTurn() {
            activeTeam = activeTeam === 1 ? 2 : 1;
            document.getElementById('team1-card').classList.toggle('active', activeTeam === 1);
            document.getElementById('team2-card').classList.toggle('active', activeTeam === 2);
        }

        function updateScores() {
            document.getElementById('team1-score').innerText = scores[1];
            document.getElementById('team2-score').innerText = scores[2];
        }

        initGrid();
    </script>
</body>
</html>
